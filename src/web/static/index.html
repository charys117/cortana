<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortana 配置台</title>
<style>
  :root {
    --bg-0: #1e1f22; --bg-1: #2b2d31; --bg-2: #313338; --bg-3: #383a40;
    --fg-0: #f2f3f5; --fg-1: #b5bac1; --fg-2: #80848e;
    --accent: #5865f2; --accent-hover: #4752c4;
    --green: #23a55a; --red: #f23f43; --yellow: #f0b232;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "gg sans", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg-2); color: var(--fg-0); display: flex; min-height: 100vh;
  }
  aside {
    width: 232px; flex-shrink: 0; background: var(--bg-1); padding: 16px 8px;
    display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh;
  }
  .guild-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 16px; }
  .guild-head img { width: 40px; height: 40px; border-radius: 12px; }
  .guild-head .g-name { font-weight: 700; }
  .guild-head .g-sub { font-size: 12px; color: var(--fg-2); }
  aside nav { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  aside nav a {
    color: var(--fg-1); text-decoration: none; padding: 8px 10px; border-radius: 6px;
    font-size: 15px; cursor: pointer;
  }
  aside nav a:hover { background: var(--bg-3); color: var(--fg-0); }
  aside nav a.active { background: var(--bg-3); color: var(--fg-0); }
  .side-actions { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  main { flex: 1; padding: 32px 40px 120px; max-width: 980px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--fg-2); font-size: 13px; margin-bottom: 28px; }
  section { margin-bottom: 40px; scroll-margin-top: 24px; }
  section > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--fg-1); margin-bottom: 12px; border-bottom: 1px solid var(--bg-3);
    padding-bottom: 8px;
  }
  .card {
    background: var(--bg-1); border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .card h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-size: 12px; color: var(--fg-1); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    background: var(--bg-0); color: var(--fg-0); border: 1px solid transparent;
    border-radius: 4px; padding: 8px 10px; font-size: 14px; font-family: inherit;
    min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input[type=color] {
    width: 42px; height: 36px; border: none; background: var(--bg-0);
    border-radius: 4px; padding: 3px; cursor: pointer;
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 4px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--accent-hover); }
  button.ghost { background: transparent; color: var(--fg-1); border: 1px solid var(--bg-3); }
  button.ghost:hover { color: var(--fg-0); background: var(--bg-3); }
  button.danger { background: transparent; color: var(--red); border: 1px solid transparent; padding: 6px 8px; }
  button.danger:hover { background: rgba(242,63,67,.12); }
  button.small { padding: 5px 10px; font-size: 13px; }
  .emoji-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg-0); border: 1px solid var(--bg-3); color: var(--fg-0);
    min-width: 44px; height: 38px; padding: 0 8px; border-radius: 4px; font-size: 20px;
  }
  .emoji-btn:hover { border-color: var(--accent); background: var(--bg-0); }
  .emoji-btn img { width: 24px; height: 24px; }
  .emoji-btn .raw { font-size: 12px; color: var(--fg-2); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    background: var(--bg-3); border-radius: 12px; padding: 3px 6px 3px 10px; font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip button { background: none; color: var(--fg-2); padding: 0 4px; font-size: 14px; }
  .chip button:hover { color: var(--red); background: none; }
  .chips input { width: 90px; padding: 4px 8px; font-size: 13px; }
  .preview {
    background: var(--bg-2); border-left: 4px solid var(--bg-3); border-radius: 4px;
    padding: 12px 14px; font-size: 15px; line-height: 1.45; word-break: break-all;
  }
  img.em { width: 22px; height: 22px; vertical-align: -5px; }
  .em-txt { font-size: 20px; }
  .board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) {
    .board-grid { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 20px 16px 120px; }
  }
  .unit-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .unit-row .place { width: 52px; color: var(--fg-2); font-size: 13px; text-align: right; }
  .savebar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
    background: var(--bg-0); border-radius: var(--radius); padding: 10px 12px 10px 18px;
    display: none; align-items: center; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    z-index: 50; width: min(640px, calc(100vw - 32px));
  }
  .savebar.show { display: flex; }
  .savebar .msg { flex: 1; font-size: 14px; color: var(--fg-1); }
  .savebar .save { background: var(--green); }
  .savebar .save:hover { background: #1e9150; }
  /* emoji picker modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .picker {
    background: var(--bg-1); border-radius: var(--radius); width: min(520px, 92vw);
    max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .picker .tabs { display: flex; border-bottom: 1px solid var(--bg-3); }
  .picker .tabs button {
    flex: 1; background: none; color: var(--fg-1); border-radius: 0; padding: 12px;
  }
  .picker .tabs button.active { color: var(--fg-0); box-shadow: inset 0 -2px 0 var(--accent); }
  .picker .p-body { padding: 14px; overflow-y: auto; }
  .picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 4px; }
  .picker .grid button {
    background: none; border-radius: 6px; height: 48px; font-size: 26px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .picker .grid button:hover { background: var(--bg-3); }
  .picker .grid img { width: 32px; height: 32px; }
  .picker .search { width: 100%; margin-bottom: 10px; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-0); color: var(--fg-0); padding: 10px 20px; border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 200; display: none; font-size: 14px;
  }
  .toast.show { display: block; }
  .toast.err { color: var(--red); }
  .toast.ok { color: var(--green); }
  .hint { font-size: 12px; color: var(--fg-2); }
  .member-tag { display: inline-flex; align-items: center; gap: 6px; }
  .member-tag img { width: 22px; height: 22px; border-radius: 50%; }
  .loading { padding: 80px; text-align: center; color: var(--fg-2); width: 100%; }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="guild-head" id="guildHead"></div>
  <nav id="nav"></nav>
  <div class="side-actions">
    <button class="ghost" id="reloadBtn">重新加载</button>
  </div>
</aside>
<main id="main"><div class="loading">加载中…</div></main>

<div class="savebar" id="savebar">
  <span class="msg">当前有未保存的修改</span>
  <button class="ghost" id="discardBtn">还原</button>
  <button class="save" id="saveBtn">保存到集群</button>
</div>

<div class="modal-mask" id="pickerMask">
  <div class="picker">
    <div class="tabs">
      <button data-tab="guild" class="active">服务器表情</button>
      <button data-tab="unicode">常用 Emoji</button>
      <button data-tab="manual">手动输入</button>
    </div>
    <div class="p-body" id="pickerBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];

let config = null;       // editable copy
let savedJson = "";      // last saved snapshot for dirty check
let guild = null;        // /api/guild data

/* ---------- api ---------- */
function token() { return localStorage.getItem("cortana_token") || ""; }
async function api(path, opts={}) {
  opts.headers = Object.assign({}, opts.headers, token() ? {"Authorization": "Bearer " + token()} : {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    const err = new Error("未授权");
    err.auth = true;
    throw err;
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function renderTokenGate(message) {
  $("#main").innerHTML = `
    <div class="loading">
      <h1 style="font-size:18px;margin-bottom:16px">🔐 需要访问令牌</h1>
      <div class="field" style="max-width:340px;margin:0 auto;text-align:left">
        <label>CORTANA_WEB_TOKEN</label>
        <input type="password" id="tokenInput" placeholder="粘贴访问令牌" autocomplete="off">
        <button id="tokenOk" style="margin-top:10px">进入配置台</button>
        <div class="hint" style="margin-top:10px">${esc(message || "令牌保存在本浏览器 localStorage 中")}</div>
      </div>
    </div>`;
  const go = () => {
    const v = $("#tokenInput").value.trim();
    if (v) { localStorage.setItem("cortana_token", v); init(); }
  };
  $("#tokenOk").onclick = go;
  $("#tokenInput").onkeydown = e => { if (e.key === "Enter") go(); };
  $("#tokenInput").focus();
}

/* ---------- emoji rendering ---------- */
const SHORTCODES = {
  heart:"❤️", heartbeat:"💓", sparkling_heart:"💖", two_hearts:"💕", heartpulse:"💗",
  yellow_heart:"💛", green_heart:"💚", blue_heart:"💙", purple_heart:"💜",
  star:"⭐", star2:"🌟", sparkles:"✨", fire:"🔥", crystal_ball:"🔮",
  moneybag:"💰", dollar:"💵", coin:"🪙", gem:"💎", trophy:"🏆", medal:"🏅", crown:"👑",
  gift:"🎁", tada:"🎉", confetti_ball:"🎊", balloon:"🎈", partying_face:"🥳",
  bubble_tea:"🧋", coffee:"☕", tea:"🍵", cake:"🍰", cookie:"🍪", candy:"🍬",
  lollipop:"🍭", doughnut:"🍩", ice_cream:"🍨", ramen:"🍜", rice:"🍚", sushi:"🍣",
  bento:"🍱", pizza:"🍕", hamburger:"🍔", fries:"🍟", apple:"🍎", strawberry:"🍓",
  peach:"🍑", watermelon:"🍉", grapes:"🍇", cherries:"🍒", beer:"🍺", sake:"🍶",
  dog:"🐶", cat:"🐱", rabbit:"🐰", bear:"🐻", panda_face:"🐼", fox_face:"🦊",
  penguin:"🐧", chick:"🐤", parrot:"🦜", unicorn:"🦄", dragon:"🐉", whale:"🐳",
  sun_with_face:"🌞", full_moon_with_face:"🌝", rainbow:"🌈", cloud:"☁️",
  zap:"⚡", snowflake:"❄️", cherry_blossom:"🌸", rose:"🌹", sunflower:"🌻",
  four_leaf_clover:"🍀", maple_leaf:"🍁", dizzy:"💫", boom:"💥", bulb:"💡",
  "100":"💯", ok_hand:"👌", thumbsup:"👍", clap:"👏", pray:"🙏", muscle:"💪",
  wave:"👋", point_up:"☝️", v:"✌️", eyes:"👀", smile:"😄", laughing:"😆",
  joy:"😂", rofl:"🤣", blush:"😊", heart_eyes:"😍", smirk:"😏", thinking:"🤔",
  sob:"😭", angry:"😠", ghost:"👻", alien:"👽", robot:"🤖", cat2:"🐈",
  game_die:"🎲", dart:"🎯", video_game:"🎮", jigsaw:"🧩", art:"🎨",
  musical_note:"🎵", notes:"🎶", microphone:"🎤", headphones:"🎧",
  rocket:"🚀", airplane:"✈️", umbrella:"☂️", hourglass:"⌛", alarm_clock:"⏰",
  bell:"🔔", key:"🔑", lock:"🔒", envelope:"✉️", memo:"📝", books:"📚",
  pill:"💊", syringe:"💉", warning:"⚠️", white_check_mark:"✅", x:"❌",
  question:"❓", exclamation:"❗", heavy_plus_sign:"➕", infinity:"♾️",
};
const CUSTOM_RE = /<(a?):(\w+):(\d+)>/;

// value -> HTML for preview
function emojiHtml(value) {
  if (!value) return '<span class="hint">未设置</span>';
  const m = String(value).match(CUSTOM_RE);
  if (m) {
    const ext = m[1] === "a" ? "gif" : "png";
    return `<img class="em" src="https://cdn.discordapp.com/emojis/${m[3]}.${ext}" title="${esc(m[2])}">`;
  }
  const sc = String(value).match(/^:([\w+-]+):$/);
  if (sc) {
    const uni = SHORTCODES[sc[1]];
    return uni ? `<span class="em-txt" title="${esc(value)}">${uni}</span>`
               : `<span class="hint">${esc(value)}</span>`;
  }
  return `<span class="em-txt">${esc(String(value))}</span>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- emoji picker ---------- */
let pickerCallback = null, pickerTab = "guild";
function openPicker(cb) {
  pickerCallback = cb; pickerTab = "guild";
  renderPicker();
  $("#pickerMask").classList.add("show");
}
function closePicker() { $("#pickerMask").classList.remove("show"); pickerCallback = null; }
$("#pickerMask").addEventListener("click", e => { if (e.target === $("#pickerMask")) closePicker(); });
$$(".picker .tabs button").forEach(b => b.addEventListener("click", () => {
  pickerTab = b.dataset.tab;
  $$(".picker .tabs button").forEach(x => x.classList.toggle("active", x === b));
  renderPicker();
}));
function pick(value) { const cb = pickerCallback; closePicker(); if (cb) cb(value); }
function renderPicker() {
  const body = $("#pickerBody");
  body.innerHTML = "";
  if (pickerTab === "guild") {
    const search = document.createElement("input");
    search.type = "text"; search.className = "search"; search.placeholder = "搜索服务器表情…";
    const grid = document.createElement("div"); grid.className = "grid";
    const draw = q => {
      grid.innerHTML = "";
      (guild ? guild.emojis : [])
        .filter(e => !q || e.name.toLowerCase().includes(q.toLowerCase()))
        .forEach(e => {
          const b = document.createElement("button");
          b.title = e.name;
          b.innerHTML = `<img src="${e.url}" alt="${esc(e.name)}">`;
          b.onclick = () => pick(e.code);
          grid.appendChild(b);
        });
      if (!grid.children.length) grid.innerHTML = '<div class="hint">没有匹配的表情</div>';
    };
    search.oninput = () => draw(search.value);
    body.append(search, grid); draw("");
  } else if (pickerTab === "unicode") {
    const search = document.createElement("input");
    search.type = "text"; search.className = "search"; search.placeholder = "搜索 (按名称, 如 heart)…";
    const grid = document.createElement("div"); grid.className = "grid";
    const draw = q => {
      grid.innerHTML = "";
      Object.entries(SHORTCODES)
        .filter(([n]) => !q || n.includes(q.toLowerCase()))
        .forEach(([n, ch]) => {
          const b = document.createElement("button");
          b.title = ":" + n + ":"; b.textContent = ch;
          b.onclick = () => pick(":" + n + ":");
          grid.appendChild(b);
        });
    };
    search.oninput = () => draw(search.value);
    body.append(search, grid); draw("");
  } else {
    body.innerHTML = `
      <div class="field" style="gap:8px">
        <label>直接输入 emoji 字符、:shortcode: 或 &lt;:name:id&gt;</label>
        <input type="text" id="manualEmoji" placeholder="例如 🎲 或 :fire: 或 <:fate:9765…>">
        <button id="manualOk" style="align-self:flex-start">确定</button>
      </div>`;
    $("#manualOk", body).onclick = () => { const v = $("#manualEmoji", body).value.trim(); if (v) pick(v); };
  }
}

// creates an emoji-select button bound to get/set
function emojiButton(get, set, showRaw=false) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "emoji-btn";
  const draw = () => {
    b.innerHTML = emojiHtml(get()) + (showRaw ? `<span class="raw">${esc(get()||"")}</span>` : "");
  };
  b.onclick = () => openPicker(v => { set(v); draw(); markDirty(); refreshPreviews(); });
  draw();
  return b;
}

/* ---------- dirty / save ---------- */
function markDirty() {
  $("#savebar").classList.toggle("show", JSON.stringify(config) !== savedJson);
}
function toast(msg, cls="ok") {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast show " + cls;
  setTimeout(() => t.classList.remove("show"), 2600);
}
$("#saveBtn").onclick = async () => {
  try {
    await api("/api/config", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(config)});
    savedJson = JSON.stringify(config);
    markDirty();
    toast("✅ 已保存并热更新");
  } catch (e) {
    if (e.auth) {
      localStorage.removeItem("cortana_token");
      toast("令牌无效或已过期, 刷新页面后重新输入", "err");
    } else {
      toast("保存失败: " + e.message, "err");
    }
  }
};
$("#discardBtn").onclick = () => { config = JSON.parse(savedJson); renderAll(); markDirty(); };
$("#reloadBtn").onclick = () => init();

/* ---------- generic helpers ---------- */
function field(labelText, input) {
  const f = document.createElement("div"); f.className = "field";
  const l = document.createElement("label"); l.textContent = labelText;
  f.append(l, input);
  return f;
}
function textInput(get, set, width=200) {
  const i = document.createElement("input");
  i.type = "text"; i.value = get() ?? ""; i.style.width = width + "px";
  i.oninput = () => { set(i.value); markDirty(); refreshPreviews(); };
  return i;
}
function numInput(get, set, width=110) {
  const i = document.createElement("input");
  i.type = "number"; i.value = get() ?? 0; i.style.width = width + "px";
  i.oninput = () => { set(Number(i.value)); markDirty(); };
  return i;
}
function colorInput(get, set) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;gap:6px;align-items:center";
  const c = document.createElement("input"); c.type = "color";
  const t = document.createElement("input"); t.type = "text"; t.style.width = "90px";
  const toHex = n => "#" + (Number(n) >>> 0).toString(16).padStart(6, "0");
  c.value = toHex(get()); t.value = toHex(get());
  c.oninput = () => { t.value = c.value; set(parseInt(c.value.slice(1), 16)); markDirty(); };
  t.onchange = () => {
    const v = t.value.trim().replace(/^#/, "");
    if (/^[0-9a-fA-F]{6}$/.test(v)) { c.value = "#" + v; set(parseInt(v, 16)); markDirty(); }
  };
  wrap.append(c, t);
  return wrap;
}
function channelSelect(get, set) {
  const s = document.createElement("select");
  const chans = guild ? guild.channels : [];
  if (!chans.some(c => c.name === get()) && get())
    s.appendChild(new Option("#" + get() + " (不存在)", get()));
  chans.forEach(c => s.appendChild(new Option("#" + c.name, c.name)));
  s.value = get() ?? "";
  s.onchange = () => { set(s.value); markDirty(); };
  return s;
}
function memberSelect(get, set) {
  const s = document.createElement("select");
  const members = (guild ? guild.members : []).filter(m => !m.bot);
  if (!members.some(m => m.name === get()) && get())
    s.appendChild(new Option(get() + " (不在服务器)", get()));
  members.forEach(m => s.appendChild(new Option(`${m.display_name} (${m.name})`, m.name)));
  s.value = get() ?? "";
  s.onchange = () => { set(s.value); markDirty(); };
  return s;
}
function chipsEditor(list, placeholder) {
  const box = document.createElement("div"); box.className = "chips";
  const draw = () => {
    box.innerHTML = "";
    list.forEach((kw, i) => {
      const c = document.createElement("span"); c.className = "chip";
      c.textContent = kw;
      const del = document.createElement("button"); del.textContent = "×";
      del.onclick = () => { list.splice(i, 1); draw(); markDirty(); };
      c.appendChild(del);
      box.appendChild(c);
    });
    const inp = document.createElement("input");
    inp.placeholder = placeholder || "+ 回车添加";
    inp.onkeydown = e => {
      if (e.key === "Enter" && inp.value.trim()) { list.push(inp.value.trim()); draw(); markDirty(); inp.focus(); }
    };
    box.appendChild(inp);
    if (box.closest("body")) inp.focus?.blur?.();
  };
  draw();
  return box;
}

/* ---------- board preview ---------- */
// mirror of src/core/tools.format_units
function formatUnits(units, total, rowSize=5) {
  if (total <= 0) return "";
  const nums = [];
  for (let i = units.length - 1; i >= 0; i--) {
    nums.push([Math.floor(total / 10**i), units[i]]);
    total %= 10**i;
  }
  let result = "";
  for (const [num, unit] of nums) {
    for (let r = 0; r < Math.floor(num / rowSize); r++) result += unit.repeat(rowSize) + "\n";
    if (num % rowSize) result += unit.repeat(num % rowSize) + "\n";
  }
  return result;
}
function mdToHtml(text) {
  let html = esc(text);
  html = html.replace(/&lt;(a?):(\w+):(\d+)&gt;/g, (_, a, n, id) =>
    `<img class="em" src="https://cdn.discordapp.com/emojis/${id}.${a === "a" ? "gif" : "png"}" title="${n}">`);
  html = html.replace(/:([\w+-]+):/g, (m0, n) => SHORTCODES[n] ? `<span class="em-txt">${SHORTCODES[n]}</span>` : m0);
  html = html.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return html.replace(/\n/g, "<br>");
}

/* --- Emoji 映射 --- */
function sectionEmoji() {

  const card = document.createElement("div"); card.className = "card";
  const draw = () => {
    card.innerHTML = "";

      row.style.alignItems = "center";
      const keyInput = document.createElement("input");
      keyInput.type = "text"; keyInput.value = key; keyInput.style.width = "160px";
      keyInput.onchange = () => {
        const nk = keyInput.value.trim();
        if (!nk || (nk !== key && config.emoji[nk] !== undefined)) { keyInput.value = key; return; }
        if (nk !== key) {
          const entries = Object.entries(config.emoji).map(([k, v]) => [k === key ? nk : k, v]);
          config.emoji = Object.fromEntries(entries);
          renderAll(); markDirty();
        }
      };
      row.append(keyInput, emojiButton(() => config.emoji[key], v => { config.emoji[key] = v; }, true));

    });

/* --- 积分板 Board --- */
function sectionBoard() {
  const s = makeSection("board", "积分板 Board · /record /bonus /done");
  const desc = document.createElement("div"); desc.className = "hint"; desc.style.marginBottom = "12px";
  desc.textContent = "每人一块积分板: bot 在指定频道维护一条消息, 用 emoji 按十进制位显示积分。units 第 1 项代表 ×1, 第 2 项代表 ×10, 以此类推。悬赏奖励使用 ×1 的 emoji。";
  s.appendChild(desc);
  const grid = document.createElement("div"); grid.className = "board-grid";
  Object.entries(config.board).forEach(([user, b]) => {
    const card = document.createElement("div"); card.className = "card";
    const h = document.createElement("h3");
    const m = (guild ? guild.members : []).find(x => x.name === user);
    if (m) {
      const img = document.createElement("img"); img.className = "avatar"; img.style.cssText = "width:28px;height:28px";
      img.src = m.avatar; h.appendChild(img);
    }
    h.appendChild(document.createTextNode(user + " 的积分板"));
    card.appendChild(h);
    const row1 = document.createElement("div"); row1.className = "row";
    row1.append(
      field("频道", channelSelect(() => b.channel, v => b.channel = v)),
      field("标题", textInput(() => b.title, v => b.title = v, 180)),
      field("积分名称", textInput(() => b.response, v => b.response = v, 140)),
    );
    card.appendChild(row1);
    const unitsBox = document.createElement("div");
    const drawUnits = () => {
      unitsBox.innerHTML = "";
      b.units.forEach((u, i) => {
        const r = document.createElement("div"); r.className = "unit-row";
        const place = document.createElement("span"); place.className = "place";
        place.textContent = "×" + 10**i;
        r.append(place, emojiButton(() => b.units[i], v => { b.units[i] = v; }, true));
        if (b.units.length > 1) {
          const del = document.createElement("button"); del.className = "danger small"; del.textContent = "移除";
          del.onclick = () => { b.units.splice(i, 1); drawUnits(); markDirty(); refreshPreviews(); };
          r.appendChild(del);
        }
        unitsBox.appendChild(r);
      });
      if (b.units.length < 4) {
        const add = document.createElement("button"); add.className = "ghost small";
        add.textContent = "+ 添加 ×" + 10**b.units.length + " 单位";
        add.onclick = () => { openPicker(v => { b.units.push(v); drawUnits(); markDirty(); refreshPreviews(); }); };
        unitsBox.appendChild(add);
      }
    };
    drawUnits();
    card.append(field("积分单位", unitsBox));
    // live preview
    const pvWrap = document.createElement("div"); pvWrap.style.marginTop = "12px";
    const pvLabel = document.createElement("div"); pvLabel.className = "row";
    const amt = document.createElement("input");
    amt.type = "number"; amt.value = 66; amt.style.width = "90px";
    pvLabel.append(field("预览积分值", amt));
    const pv = document.createElement("div"); pv.className = "preview";
    const drawPv = () => {
      const total = Number(amt.value) || 0;
      pv.innerHTML = mdToHtml(`${b.title}\n${formatUnits(b.units, total)}${total}`);
      pv.style.borderLeftColor = "var(--accent)";
    };
    amt.oninput = drawPv;
    previewFns.push(drawPv);
    pvWrap.append(pvLabel, pv);
    card.appendChild(pvWrap);
    grid.appendChild(card);
  });
  s.appendChild(grid);
  return s;
}

  const s = makeSection("award", "授勋 Award · !award 称号徽章");

  desc.textContent = "每人配置一组可颁发的称号, 每个称号带表情 (引用 Emoji 映射的条目名) 与徽章颜色。";

    const card = document.createElement("div"); card.className = "card";
    const h = document.createElement("h3"); h.textContent = user + " 可颁发的称号";
    card.appendChild(h);
    const draw = () => {
      [...card.querySelectorAll(".row, .ghost")].forEach(e => e.remove());
      Object.entries(titles).forEach(([title, [emojiKey, color]]) => {
        const row = document.createElement("div"); row.className = "row";
        const tInput = document.createElement("input");
        tInput.type = "text"; tInput.value = title; tInput.style.width = "120px";
        tInput.onchange = () => {
          const nt = tInput.value.trim();
          if (!nt || (nt !== title && titles[nt])) { tInput.value = title; return; }
          if (nt !== title) {
            const entries = Object.entries(titles).map(([k, v]) => [k === title ? nt : k, v]);
            config.award[user] = titles = Object.fromEntries(entries);
            draw(); markDirty();
          }
        };
        const emojiSel = document.createElement("select");
        Object.keys(config.emoji).forEach(k => emojiSel.appendChild(new Option(k, k)));
        emojiSel.value = emojiKey;
        emojiSel.onchange = () => { titles[title][0] = emojiSel.value; markDirty(); drawIcon(); };
        const icon = document.createElement("span");
        const drawIcon = () => { icon.innerHTML = emojiHtml(config.emoji[titles[title][0]]); };
        drawIcon();
        row.append(
          field("称号", tInput),
          field("表情", emojiSel),
          field("", icon),
          field("徽章颜色", colorInput(() => titles[title][1], v => titles[title][1] = v)),
        );
        const del = document.createElement("button"); del.className = "danger small"; del.textContent = "删除";
        del.onclick = () => { delete titles[title]; draw(); markDirty(); };
        row.appendChild(del);
        card.appendChild(row);
      });
      const add = document.createElement("button"); add.className = "ghost small"; add.textContent = "+ 新增称号";
      add.onclick = () => {
        const t = prompt("称号名称:");
        if (!t || titles[t]) return;
        titles[t] = [Object.keys(config.emoji)[0] || "", 5793266];
        draw(); markDirty();
      };
      card.appendChild(add);
    };
    draw();
    s.appendChild(card);
  });
  return s;
}

/* ---------- init ---------- */
async function init() {
  $("#main").innerHTML = '<div class="loading">加载中…</div>';
  try {
    const [c, g] = await Promise.all([api("/api/config"), api("/api/guild").catch(() => null)]);
    config = c.config;
    savedJson = JSON.stringify(config);
    guild = g;
    if (guild) {
      $("#guildHead").innerHTML = `
        ${guild.guild.icon ? `<img src="${guild.guild.icon}">` : ""}
        <div><div class="g-name">${esc(guild.guild.name)}</div>
        <div class="g-sub">${guild.emojis.length} 个表情 · ${guild.channels.length} 个频道</div></div>`;
    } else {
      $("#guildHead").innerHTML = `<div class="g-sub">⚠️ bot 未连接, 服务器数据不可用</div>`;
    }
    renderAll();
    markDirty();
  } catch (e) {
    if (e.auth) {
      renderTokenGate(token() ? "令牌无效或已过期, 请重新输入" : "");
      return;
    }
    $("#main").innerHTML = `<div class="loading">加载失败: ${esc(e.message)}<br><br><button onclick="init()">重试</button></div>`;
  }
}
window.addEventListener("beforeunload", e => {
  if (JSON.stringify(config) !== savedJson) e.preventDefault();
});
init();
