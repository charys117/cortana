<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#dfe3ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#aab4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- C-shaped ring, gap facing right -->
  <path d="M 43.3 43.3 A 16 16 0 1 1 43.3 20.7"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- core -->
  <circle cx="32" cy="32" r="11" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="5.5" fill="#ffffff"/>
  <!-- orbit node in the gap -->
  <circle cx="48" cy="32" r="3.2" fill="#ffffff"/>
</svg>
