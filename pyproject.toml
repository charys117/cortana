[project]
name = "cortana"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "coloredlogs>=15.0.1",
    "httpx>=0.28.1",
    "py-cord>=2.6.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I", # import sorting
]
ignore = [
    "BLE001",   # blind `except Exception` is intentional in task/command guards
    "ASYNC230", # sync file IO in async funcs is acceptable at this bot's scale
    "DTZ007",   # naive strptime results are localized to cfg timezone right after
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
