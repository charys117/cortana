# Sanitized example config. The live config is stored in PostgreSQL (bot_config
# table) and edited through the web UI; a config.yml is only read once, on first
# boot against an empty database, to seed it. Copy to config.yml and fill in
# your own values for that first boot.
guild: MyGuild
guild_id: 123456789012345678
timezone: -8
# the two members who use the bot; each is the other's notification receiver
pair:
  - alice
  - bob
bark:
  alice: https://bark.example.com/your-bark-key
  bob: https://bark.example.com/another-bark-key
  post:
    title: Cortana
    body: ""
    icon: https://example.com/icon.jpg
    group: Cortana
emoji:
  cortana: <:Cortana:000000000000000000>
  rank1: <:rank1:000000000000000000>
  fate: <:fate:000000000000000000>
cortana:
  cortana:
    display_name: Cortana
    color: 3447003
    online: Cortana is online
    offline: Cortana is offline
awake_notify:
  alice: Bob is awake!
  bob: Alice is awake!
archive_keyword:
  food:
    - food
  meme:
    - meme
board:
  alice:
    channel: a-board
    # units[i] is the emoji for the 10**i place of the score
    units:
      - ':heart:'
      - ':heartbeat:'
    title: '**CURRENT**:'
    response: score
  bob:
    channel: b-board
    units:
      - ':coin:'
      - ':moneybag:'
    title: '**CURRENT**:'
    response: score
award:
  alice:
    rank1:
      - rank1     # key in the emoji map
      - 4286945   # badge color
archive_embed:
  video:
    - https://www.bilibili.com/video
    - https://b23.tv
  music:
    - https://open.spotify.com
# message archive: messages go to PostgreSQL (connection via the DATABASE_URL
# env var), attachment binaries go to media_root (mount a PVC there)
archive:
  media_root: ./archive/media
  exclude_channels: []
  download_concurrency: 6
  max_download_attempts: 3
  rescan_days: 7
daily:
  channel: night
